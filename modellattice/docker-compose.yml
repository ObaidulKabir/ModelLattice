services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: modellattice
      POSTGRES_PASSWORD: modellattice
      POSTGRES_DB: modellattice
    ports:
      - "5455:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U modellattice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
