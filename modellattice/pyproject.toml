[project]
name = "modellattice"
version = "0.1.0"
description = "ModelLattice: explainable AI model decision intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.27,<1.0",
    "mcp>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.7,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "mcp_server*"]

[tool.pytest.ini_options]
# Without this, pytest's default *_test.py pattern also auto-collects the
# code-edit task fixtures under app/evals/data/ (e.g. task_001_test.py),
# which import a "solution" module that only exists inside the sandboxed
# subprocess the eval runner creates - they are eval fixtures, not our
# own test suite.
testpaths = ["tests"]
